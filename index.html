<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบการเงิน PTU</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #f8fafc;
      font-family: 'Sarabun', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* กำหนดให้ iframe ขยายเต็มพื้นที่ความกว้างและความสูงของเบราว์เซอร์ */
    .app-frame {
      width: 100%;
      height: 100vh;
      border: none;
      outline: none;
      display: block;
    }
  </style>
</head>
<body>
  <iframe 
    class="app-frame" 
    src="https://script.google.com/a/macros/mahidol.ac.th/s/AKfycbxVD47cLabkuZlfe2T8d31S-Cfo8j84f1eBBVYE61NaCPPn97bfvMx2ZOG9tn7QmLOdkg/exec" 
    allow="geolocation; microphone; camera; clipboard-write;"
    sandbox="allow-forms allow-modals allow-popups allow-popups-to-escape-sandbox allow-same-origin allow-scripts allow-downloads">
  </iframe>
</body>
</html>
