<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ตรวจสอบสถานะ · PTU</title>
<link rel="icon" href="logo.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0B1F45">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap">
<link rel="stylesheet" href="app.css">
</head>
<body>

<header>
  <a class="back" href="./" aria-label="กลับหน้าแรก">&#8249;</a>
  <h1>ตรวจสอบสถานะและยอดค้าง</h1>
</header>

<main>
  <div id="msg" class="msg"></div>

  <section class="card u" id="s1">
    <h2>ค้นหาข้อมูลของคุณ</h2>
    <p class="sub">กรอกรหัสนักศึกษา หรือชื่อ-นามสกุล</p>
    <label for="term">รหัสนักศึกษา หรือ ชื่อ-นามสกุล</label>
    <input id="term" placeholder="6512345678 หรือ สมปอง ดีใจ" autocomplete="off">
    <button class="btn alt" id="bFind">ตรวจสอบ</button>
  </section>

  <section class="card u hide" id="s2">
    <h2>ยอดค่าเทอม</h2>
    <div id="info"></div>
    <button class="btn ghost" id="bReset">ค้นหาคนอื่น</button>
  </section>

  <section class="card u hide" id="s3">
    <h2>ประวัติการแจ้งชำระเงิน</h2>
    <p class="sub" id="histSub"></p>
    <div id="hist"></div>
    <a class="btn" href="pay.html" style="text-decoration:none">แจ้งชำระเงินเพิ่ม</a>
  </section>
</main>

<script src="app.js"></script>
<script>
$("bFind").addEventListener("click", function () {
  clearSay();
  var term = $("term").value.trim();
  if (term.length < 3) return say("กรุณากรอกรหัสนักศึกษา หรือชื่อ-นามสกุลอย่างน้อย 3 ตัวอักษร");

  var btn = this;
  busy(btn, true, "กำลังตรวจสอบ…");

  Promise.all([api("findStudent", { term: term }), api("history", { term: term })]).then(function (res) {
    busy(btn, false);
    var s = res[0], h = res[1];

    if (!s.success) return say(s.message || "ไม่พบข้อมูลนักศึกษา กรุณาตรวจสอบการสะกดให้ตรงกับตอนลงทะเบียน");

    var pending = /^pending(-|$)/i.test(String(s.studentId || ""));
    var paid = Math.max(0, Number(s.total || 0) - Number(s.balance || 0));
    var pct = Number(s.total) ? Math.round(paid * 100 / Number(s.total)) : 0;

    $("info").innerHTML =
      '<div class="kv"><span>ชื่อ-นามสกุล</span><b>' + esc(s.name) + '</b></div>' +
      '<div class="kv"><span>รหัสนักศึกษา</span><b>' +
        (pending ? '<span class="chip w">ยังไม่ได้รับรหัส</span>' : esc(s.studentId)) + '</b></div>' +
      '<div class="kv"><span>คณะ / สาขา</span><b>' + esc(s.faculty) + '<br>' + esc(s.major) + '</b></div>' +
      '<div class="kv"><span>รุ่น</span><b>' + esc(s.batch || "-") + '</b></div>' +
      '<div class="kv"><span>ยอดเต็มหลักสูตร</span><b>' + baht(s.total) + ' บาท</b></div>' +
      '<div class="kv"><span>ชำระแล้ว (อนุมัติ)</span><b>' + baht(paid) + ' บาท · ' + pct + '%</b></div>' +
      '<div class="kv"><span>จำนวนครั้งที่ชำระ</span><b>' + esc(s.payCount || 0) + ' ครั้ง</b></div>' +
      '<div class="kv"><span>ยอดค้างชำระ</span><b class="big">' + baht(s.balance) + ' บาท</b></div>' +
      (pending ? '<div class="note">ได้รหัสนักศึกษาจริงแล้ว? ผูกรหัสได้ที่หน้า <a href="linkid.html">เพิ่มรหัสนักศึกษา</a></div>' : "");

    var recs = (h && h.success) ? (h.records || []) : [];
    recs.sort(function (a, b) { return String(b.date).localeCompare(String(a.date)); });

    $("histSub").textContent = recs.length ? "ทั้งหมด " + recs.length + " รายการ เรียงจากใหม่ไปเก่า" : "";
    $("hist").innerHTML = recs.length ? recs.map(function (r) {
      return '<div class="item">' +
        '<div class="top"><b>' + baht(r.amount) + ' บาท</b>' + statusChip(r.status) + '</div>' +
        '<div class="mute">' +
          'รหัสรายการ ' + esc(r.payId) + '<br>' +
          'แจ้งเมื่อ ' + esc(r.date) + '<br>' +
          'โอนวันที่ ' + esc(r.transferDate || "-") + ' · ' + esc(r.bank || "-") + '<br>' +
          'ผู้โอน ' + esc(r.payerName || "-") + ' (' + esc(r.payerRelation || "-") + ')' +
          (r.approvalDate ? '<br>อนุมัติเมื่อ ' + esc(r.approvalDate) : "") +
          (r.note ? '<br><span style="color:#A32020">หมายเหตุ: ' + esc(r.note) + '</span>' : "") +
        '</div>' +
        (r.officialReceiptUrl ? '<a class="btn ghost" style="text-decoration:none;margin-top:10px" href="' +
          esc(r.officialReceiptUrl) + '" target="_blank" rel="noopener">ดูใบเสร็จทางการ</a>' : "") +
      '</div>';
    }).join("") : '<p class="mute" style="font-size:13.5px;color:#5C6F8C">ยังไม่มีรายการแจ้งชำระเงิน</p>';

    $("s1").classList.add("hide");
    $("s2").classList.remove("hide");
    $("s3").classList.remove("hide");
    window.scrollTo({ top: 0, behavior: "smooth" });
  });
});

$("term").addEventListener("keydown", function (e) { if (e.key === "Enter") $("bFind").click(); });

$("bReset").addEventListener("click", function () {
  $("s2").classList.add("hide"); $("s3").classList.add("hide"); $("s1").classList.remove("hide");
  clearSay();
});
</script>
</body>
</html>
